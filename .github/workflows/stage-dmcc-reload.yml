name: Stage verified DMCC reload implementation

on:
  push:
    branches: [feat/dmcc-reload-parity-20261116]
    paths:
      - tools/dmcc_reload_patch.py
      - .github/workflows/stage-dmcc-reload.yml

permissions:
  contents: write

concurrency:
  group: stage-dmcc-reload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'oMiki0826o/Discord-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check expected patch anchors
        run: python3 tools/dmcc_reload_patch.py . --check > /tmp/dmcc-reload.patch
      - name: Apply checked patch and validate diff
        run: |
          python3 tools/dmcc_reload_patch.py . --apply
          git diff --check
          git status --short
      - name: Test and build Fabric 1.21.8
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon -Pminecraft_version=1.21.8 -Pfabric_api_version='0.136.1+1.21.8' test remapJar
      - name: Test and build Fabric 1.21.9
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon -Pminecraft_version=1.21.9 -Pfabric_api_version='0.134.0+1.21.9' test remapJar
      - name: Test and build NeoForge 1.21.8
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon --project-dir ../neoforge-bridge test jar
      - name: Commit verified code on feature branch only
        env:
          EXPECTED_BRANCH: feat/dmcc-reload-parity-20261116
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/minecraft-bridge/src/main/java/io/miki/dmcc/bridge/BridgeMod.java \
                  bridge/minecraft-bridge/src/main/java/io/miki/dmcc/bridge/BridgeRuntime.java \
                  bridge/minecraft-bridge/src/main/java/io/miki/dmcc/bridge/BridgeReloadPlan.java \
                  bridge/minecraft-bridge/src/test/java/io/miki/dmcc/bridge/BridgeRuntimeTest.java \
                  bridge/minecraft-bridge/src/test/java/io/miki/dmcc/bridge/BridgeReloadPlanTest.java \
                  bridge/neoforge-bridge/src/main/java/io/miki/dmcc/bridge/NeoBridgeMod.java \
                  bridge/neoforge-bridge/build.gradle docs/DMCC.md
          if ! git diff --cached --quiet; then
            git commit -m "feat(dmcc): add reloadable Fabric and NeoForge bridge configuration"
            git push origin HEAD:"$EXPECTED_BRANCH"
          fi
