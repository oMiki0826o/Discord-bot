name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: dmcc-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: ruff check bot tools tests main.py
      - name: Run tests
        run: pytest -q

  neoforge:
    name: neoforge (1.21.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build NeoForge bridge
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon --project-dir ../neoforge-bridge test jar
      - name: Smoke-test actual NeoForge dedicated server startup
        working-directory: bridge/minecraft-bridge
        run: |
          mkdir -p ../neoforge-bridge/run/config
          printf 'eula=true\n' > ../neoforge-bridge/run/eula.txt
          cat > ../neoforge-bridge/run/config/minecraft-bridge.properties <<'EOF'
          server_id=survival
          gateway_host=127.0.0.1
          gateway_port=8765
          authentication_secret=smoke-only-development-secret
          EOF
          set +e
          timeout --signal=TERM --kill-after=5s 150s ./gradlew --no-daemon --project-dir ../neoforge-bridge runServer > ../neoforge-bridge/run/smoke.log 2>&1
          code=$?
          set -e
          if ! grep -Eq 'Done \([0-9.]+s\)' ../neoforge-bridge/run/logs/latest.log; then
            tail -n 180 ../neoforge-bridge/run/smoke.log
            echo "NeoForge server startup not observed (exit=$code)" >&2
            exit 1
          fi
          if grep -E 'ModLoadingException|Failed to create mod instance|NoClassDefFoundError|ExceptionInInitializerError' ../neoforge-bridge/run/smoke.log; then
            tail -n 180 ../neoforge-bridge/run/smoke.log
            exit 1
          fi
          echo "NeoForge 1.21.8 dedicated server startup verified"
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-bridge-neoforge-1.21.8
          path: bridge/neoforge-bridge/build/libs/minecraft-bridge-neoforge-*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, bridge, neoforge]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Download current built Fabric bridges
        uses: actions/download-artifact@v4
        with:
          pattern: minecraft-bridge-1.21.*
          path: bridge/builds
          merge-multiple: false
      - name: Stage and verify version-specific Fabric jars
        run: |
          cp bridge/builds/minecraft-bridge-1.21.8/java_bridge.jar bridge/java_bridge.jar
          cp bridge/builds/minecraft-bridge-1.21.8/SHA256SUMS bridge/SHA256SUMS
          (cd bridge && sha256sum --check SHA256SUMS)
          mkdir -p bridge/versions/1.21.9
          cp bridge/builds/minecraft-bridge-1.21.9/java_bridge.jar bridge/versions/1.21.9/java_bridge.jar
          cp bridge/builds/minecraft-bridge-1.21.9/SHA256SUMS bridge/versions/1.21.9/SHA256SUMS
          (cd bridge/versions/1.21.9 && sha256sum --check SHA256SUMS)
      - name: Download NeoForge 1.21.8 server bridge
        uses: actions/download-artifact@v4
        with:
          name: minecraft-bridge-neoforge-1.21.8
          path: bridge/builds/neoforge-1.21.8
      - name: Stage and verify NeoForge server bridge
        run: |
          mkdir -p bridge/versions/neoforge-1.21.8
          cp bridge/builds/neoforge-1.21.8/minecraft-bridge-neoforge-*.jar bridge/versions/neoforge-1.21.8/java_bridge.jar
          (cd bridge/versions/neoforge-1.21.8 && sha256sum java_bridge.jar > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Build reproducible release archive
        run: python tools/build_release.py --require-bridge
      - name: Verify release archive
        run: python -m zipfile --test "dist/Discord-Bot-v$(cat VERSION).zip"
      - name: Read release version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Bot-v${{ steps.version.outputs.value }}
          path: dist/Discord-Bot-v${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
          retention-days: 14

  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.8'
            fabric_api: '0.136.1+1.21.8'
          - minecraft: '1.21.9'
            fabric_api: '0.134.0+1.21.9'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            bridge/minecraft-bridge/*.gradle
            bridge/minecraft-bridge/gradle.properties
            bridge/minecraft-bridge/gradle/wrapper/gradle-wrapper.properties
      - name: Test and build Fabric bridge
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon -Pminecraft_version=${{ matrix.minecraft }} -Pfabric_api_version=${{ matrix.fabric_api }} test remapJar
      - name: Smoke-test actual Fabric server startup
        working-directory: bridge/minecraft-bridge
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=5s 120s ./gradlew --no-daemon \
            -Pminecraft_version=${{ matrix.minecraft }} \
            -Pfabric_api_version=${{ matrix.fabric_api }} \
            runServer --args=nogui > run/smoke.log 2>&1
          code=$?
          set -e
          if ! grep -Eq 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)' run/logs/latest.log; then
            tail -n 160 run/smoke.log
            echo "Fabric smoke failed: server startup was not observed (exit=$code)" >&2
            exit 1
          fi
          if grep -E 'Mixin apply failed|Critical injection failure|InvalidInjectionException|MixinTransformerError' run/smoke.log; then
            tail -n 160 run/smoke.log
            exit 1
          fi
          echo "Fabric server startup and mixin loading smoke verified"

      - name: Stage compiled Fabric bridge and checksum
        working-directory: bridge/minecraft-bridge
        run: |
          cp build/libs/minecraft-bridge-0.2.4.jar ../java_bridge.jar
          cd ..
          sha256sum java_bridge.jar > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload verified Fabric bridge
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-bridge-${{ matrix.minecraft }}
          path: |
            bridge/java_bridge.jar
            bridge/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
