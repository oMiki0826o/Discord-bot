name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting and lint
        run: ruff check bot tools tests main.py
      - name: Run tests
        run: pytest -q

  release:
    runs-on: ubuntu-latest
    needs: [test, bridge]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build reproducible release archive
        run: python tools/build_release.py
      - name: Verify release archive
        run: python -m zipfile --test "dist/Discord-Bot-v$(cat VERSION).zip"

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            bridge/minecraft-bridge/*.gradle
            bridge/minecraft-bridge/gradle.properties
            bridge/minecraft-bridge/gradle/wrapper/gradle-wrapper.properties
      - name: Test and build Fabric bridge
        working-directory: bridge/minecraft-bridge
        run: ./gradlew --no-daemon test remapJar
      - name: Verify published bridge artifact
        working-directory: bridge/minecraft-bridge
        run: cmp build/libs/minecraft-bridge-0.2.1.jar ../java_bridge.jar
